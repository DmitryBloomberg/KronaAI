services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 15s

  bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      DATABASE_PATH: /app/data/kronai.sqlite3
    volumes:
      - bot_data:/app/data
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  ollama_models:
  bot_data:
